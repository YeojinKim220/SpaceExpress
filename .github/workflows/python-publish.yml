name: Test and publish SpaceExpress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spaceexpress-release
  cancel-in-progress: false

jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install R dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-cran-lmtest r-cran-fitdistrplus r-cran-dplyr r-cran-lme4
      - name: Install package and tests
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install '.[test]'
      - name: Run regressions
        run: python -m pytest tests -q
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Check release version
        id: version
        shell: python
        run: |
          import os, tomllib, urllib.request, urllib.error
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          try:
              urllib.request.urlopen(f'https://pypi.org/pypi/spaceexpress/{version}/json')
              publish = 'false'
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
              publish = 'true'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'version={version}\npublish={publish}\n')
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: test-build
    if: needs.test-build.outputs.publish == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Record GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.test-build.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: gh release create "v${VERSION}" --target "$COMMIT" --title "SpaceExpress ${VERSION}" --generate-notes dist/*
